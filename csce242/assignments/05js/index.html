<!DOCTYPE html>
<html>
    <head>
        <title>Introduction to Java Script</title>
        <link rel="stylesheet" href="styles.css" />
        <script src="scripts/bfs.js"></script>
    </head>
    <body>
        <header>
            <div>
                <h1>Assignment 7</h1>
            </div>
            <div>
                <h2>Introduction to JavaScript</h2>
            </div>
        </header>
        <main>
            <div class="columns">
                <div id="speech-area" class="bubble">
                    <h3>Speech</h3>
                </div>
                <div id="section">
                    <h3>Beverage</h3>
                    <label for ="beverages">Pick your morning beverage: </label>
                    <select id="beverages">
                        <option value="" disabled selected>Select a beverage</option>
                        <option id="bev-choice" value="Coffee">Coffee</option>
                        <option id="bev-choice" value="Orange Juice">Orange Juice</option>
                        <option id="bev-choice" value="Milk">Milk</option>
                        <option id="bev-choice" value="Hot Chocolate">Hot Chocolate</option>
                    </select>
                    <p id="bev-message"></p>
                </div>
                <div id="emoji-draw" class="emoji-draw">
                        <h3>Add a Sticker</h3>
                        <img id="image" src="images/slice-of-pepperoni-pizza-with-melted-cheese-and-spicy-sausage-on-transparent-background-free-png.jpg" alt="Pizza Picture" height="200" width="200">
                </div>
            </div>
        </main>
        <footer>
            <h3>&copy; braydenedwards</h3>
        </footer>
    </body>
</html>
